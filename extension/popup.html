<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #5558e6; }
    .status { margin-top: 8px; font-size: 12px; color: #666; }
    .logged-in { text-align: center; }
    .logged-in p { color: #16a34a; margin: 8px 0; }
    .add-btn {
      background: #6366f1;
      font-size: 14px;
      padding: 10px;
      margin-top: 4px;
    }
    .add-btn:hover { background: #5558e6; }
    .add-status { margin-top: 8px; font-size: 12px; color: #16a34a; min-height: 16px; }
    .logout-link {
      background: none;
      border: none;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: underline;
      width: auto;
      padding: 0;
    }
    .logout-link:hover { background: none; color: #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="login-form">
    <h3>Second Brain</h3>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Log in</button>
    <div class="status" id="error"></div>
  </div>

  <div id="logged-in-view" class="logged-in hidden">
    <h3>Second Brain</h3>
    <p>You're logged in!</p>
    <button class="add-btn" id="add-btn">+ Add this page</button>
    <div class="add-status" id="add-status"></div>
    <br/>
    <button class="logout-link" id="logout-btn">Log out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
